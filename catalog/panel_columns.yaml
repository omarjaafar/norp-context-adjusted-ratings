# What every column of the organization-year panel means (CP4).
#
# The Data Scout and the Planner see these descriptions, not just the bare names.
# Every column in data/output/panel_join_log.json (panel.columns) and every derived
# column in theorylab/theory_run.DERIVED must be listed; tests/test_agents_trust.py
# fails otherwise. When the need table gains columns, add them here.
#
#   level : the unit the value belongs to (organization-year, county-year, or key)
#   role  : key | outcome | exposure | control | filter | other (a hint, not a rule)

columns:
  ein: {level: key, role: key, description: "IRS employer identification number of the organization"}
  tax_year: {level: key, role: key, description: "Tax year of the Form 990 filing (2018-2022)"}
  return_type: {level: organization-year, role: filter, description: "Form type filed: 990 (full), 990EZ; ratio theories use 990 only"}
  revenue_total: {level: organization-year, role: control, description: "Total revenue, current year (Form 990 Part I), US dollars"}
  expenses_total: {level: organization-year, role: other, description: "Total expenses, current year (Part I), US dollars"}
  fundraising_expense_p01: {level: organization-year, role: other, description: "Professional fundraising fees reported in Part I, US dollars"}
  contributions: {level: organization-year, role: other, description: "Contributions, gifts and grants received, US dollars"}
  program_revenue: {level: organization-year, role: other, description: "Program service revenue, US dollars"}
  salaries: {level: organization-year, role: other, description: "Salaries, compensation and employee benefits, US dollars"}
  net_assets_boy: {level: organization-year, role: other, description: "Net assets or fund balances at the beginning of the year, US dollars"}
  net_assets_eoy: {level: organization-year, role: other, description: "Net assets or fund balances at the end of the year, US dollars"}
  p09_total_expense: {level: organization-year, role: other, description: "Total functional expenses (Part IX column A), US dollars"}
  p09_program_expense: {level: organization-year, role: other, description: "Program service expenses (Part IX column B), US dollars"}
  p09_management_expense: {level: organization-year, role: other, description: "Management and general expenses (Part IX column C), US dollars"}
  p09_fundraising_expense: {level: organization-year, role: other, description: "Fundraising expenses (Part IX column D), US dollars"}
  has_p09: {level: organization-year, role: filter, description: "True when the filing has a Part IX row"}
  total_assets_eoy: {level: organization-year, role: other, description: "Total assets at end of year (Part X), US dollars"}
  total_liabilities_eoy: {level: organization-year, role: other, description: "Total liabilities at end of year (Part X), US dollars"}
  has_p10: {level: organization-year, role: filter, description: "True when the filing has a Part X row"}
  county_fips: {level: key, role: key, description: "5-digit county FIPS code of the organization (NORP NGO table); the unit county exposures are assigned at"}
  state: {level: organization, role: control, description: "Two-letter state of the organization; used for state fixed effects and the state hold-out"}
  category: {level: organization, role: control, description: "NORP sector category of the organization (e.g. health, education, human services)"}
  has_county: {level: organization-year, role: filter, description: "True when the organization is linked to a county"}
  population: {level: county-year, role: exposure, description: "County population (ACS 5-year)"}
  median_household_income: {level: county-year, role: exposure, description: "County median household income (ACS 5-year), US dollars"}
  poverty_universe: {level: county-year, role: other, description: "People for whom poverty status is determined (ACS denominator)"}
  below_poverty: {level: county-year, role: other, description: "People below the poverty line (ACS count)"}
  civilian_labor_force: {level: county-year, role: other, description: "Civilian labor force (ACS count)"}
  unemployed: {level: county-year, role: other, description: "Unemployed people in the civilian labor force (ACS count)"}
  poverty_rate: {level: county-year, role: exposure, description: "Share of people below the poverty line in the county, 0-1 (ACS)"}
  unemployment_rate: {level: county-year, role: exposure, description: "Share of the civilian labor force unemployed in the county, 0-1 (ACS)"}
  need_index: {level: county-year, role: exposure, description: "Economic need index: mean of z-scores of poverty rate, unemployment rate and minus log median income; higher = more need"}
  high_need: {level: county-year, role: exposure, description: "True for the top quarter of counties on need_index in that year (binary exposure)"}
  acs_estimated: {level: county-year, role: filter, description: "True for county rows estimated (rebuilt Connecticut regions), not published by ACS"}
  avg_housing_burden: {level: county-year, role: exposure, description: "Population-weighted mean housing-cost burden of the county's tracts, percent (NORP disadvantaged communities)"}
  food_desert_share: {level: county-year, role: exposure, description: "Population-weighted share of the county's tracts flagged as food deserts (NORP disadvantaged communities)"}
  chr_poor_fair_health: {level: county-year, role: exposure, description: "Share of adults reporting poor or fair health, 0-1, age-adjusted (County Health Rankings, BRFSS-based; data year = tax year). Level shifts down from tax year 2020: compare within year"}
  chr_uninsured: {level: county-year, role: exposure, description: "Share of people under 65 without health insurance, 0-1 (County Health Rankings, Census SAHIE; data year = tax year)"}
  chr_some_college: {level: county-year, role: exposure, description: "Share of adults aged 25-44 with some post-secondary education, 0-1 (County Health Rankings, ACS 5-year ending in the tax year)"}
  chr_hs_completion: {level: county-year, role: exposure, description: "Share of adults aged 25 and over with a high-school diploma or equivalent, 0-1 (County Health Rankings, ACS 5-year ending in the tax year; missing for tax year 2018)"}
  chr_violent_crime_rate: {level: county-year, role: exposure, description: "Violent crimes reported per 100,000 people (County Health Rankings, FBI UCR 2014 and 2016 average); one snapshot, same value every tax year; about 9% of counties missing"}
  has_need: {level: organization-year, role: filter, description: "True when the organization's county has need-table data for that year"}
  program_expense_ratio: {level: organization-year, role: outcome, description: "Program expenses / total functional expenses, 0-1; higher = more spent on programs"}
  admin_expense_ratio: {level: organization-year, role: outcome, description: "Management and general expenses / total functional expenses, 0-1 (administrative overhead)"}
  fundraising_expense_ratio: {level: organization-year, role: outcome, description: "Fundraising expenses / total functional expenses, 0-1"}
  fundraising_efficiency: {level: organization-year, role: outcome, description: "Cost of raising one dollar: fundraising expenses / contributions; higher = more expensive fundraising"}
  operating_margin: {level: organization-year, role: outcome, description: "(Revenue - expenses) / revenue; negative = deficit"}
  equity_ratio: {level: organization-year, role: outcome, description: "End-of-year net assets / revenue (reserves measured in years of revenue)"}
  liabilities_to_assets: {level: organization-year, role: outcome, description: "Total liabilities / total assets; higher = more debt, more financially vulnerable"}
  revenue_concentration: {level: organization-year, role: outcome, description: "Herfindahl index over contributions, program revenue and other revenue; 1 = a single source, 1/3 = evenly split"}
  standard_rating: {level: organization-year, role: outcome, description: "Context-blind 0-10 financial rating: mean score of program share, admin share, fundraising cost and liabilities-to-assets (docs/ratings_theory.md)"}
  rating_components: {level: organization-year, role: other, description: "How many of the four ratios standard_rating averages (2-4)"}
  revenue_growth: {level: organization-year, role: outcome, description: "Revenue change from the previous tax year / previous revenue"}
  log_revenue: {level: organization-year, role: control, description: "Natural log of total revenue (missing when revenue <= 0); the size control (derived)"}
